<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182b" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#183a5e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-25px, 20px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulseOrb2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.2) translate(30px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatCard4 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .card-1 { animation: floatCard1 4.5s ease-in-out infinite; }
    .card-2 { animation: floatCard2 5.2s ease-in-out infinite; }
    .card-3 { animation: floatCard3 4.8s ease-in-out infinite; }
    .card-4 { animation: floatCard4 5.6s ease-in-out infinite; }
    .wave-line { animation: waveFlow 7s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g opacity="0.5">
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="270" r="160" fill="#059669" filter="url(#glow)" />
    <circle cx="920" cy="70" r="90" fill="#3b82f6" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Decorative Tech Wave Elements -->
  <path class="wave-line" d="M -50 290 Q 250 250 550 300 T 1150 270 T 1300 290" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
  <path class="wave-line" d="M -50 310 Q 300 270 650 320 T 1200 290" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="2" />

  <!-- Dynamic Floating Feature Badges (Kept to lower section so title stays unobscured) -->
  <g transform="translate(140, 260)">
    <!-- Pill 1: Citizen Engagement -->
    <g class="card-1">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="100" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">🏛️ Citizen Engagement</text>
    </g>

    <!-- Pill 2: GovTech & 311 Systems -->
    <g class="card-2" transform="translate(225, 0)">
      <rect x="0" y="0" width="215" height="42" rx="21" fill="url(#cardBg)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5" />
      <text x="107" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">⚡ GovTech &amp; 311 CRM</text>
    </g>

    <!-- Pill 3: Compliance & Security -->
    <g class="card-3" transform="translate(465, 0)">
      <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#cardBg)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5" />
      <text x="110" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">🛡️ FedRAMP &amp; Public Trust</text>
    </g>

    <!-- Pill 4: Open Source Civic Tech -->
    <g class="card-4" transform="translate(710, 0)">
      <rect x="0" y="0" width="210" height="42" rx="21" fill="url(#cardBg)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
      <text x="105" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">🌐 Open-Source Civic Tech</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle (Unobscured Foreground) -->
  <g text-anchor="middle">
    <!-- Top Pill Tag -->
    <rect x="475" y="42" width="250" height="30" rx="15" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">GOVTECH &amp; CIVIC SOFTWARE</text>

    <!-- Main Title -->
    <text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      Awesome Public Sector CRM
    </text>

    <!-- Subtitle -->
    <text x="600" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
      Top Public Sector CRM, GovTech SaaS Platforms &amp; Open-Source Civic Technologies
    </text>

    <!-- Value Statement -->
    <text x="600" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Curated commercial solutions (Salesforce Gov Cloud, OpenGov, Granicus) &amp; Self-hosted civic engines
    </text>
  </g>
</svg>
